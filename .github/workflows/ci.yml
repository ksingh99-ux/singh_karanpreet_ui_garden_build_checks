name: CI - Code Quality Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run check-format

      - name: ESLint check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          CI: false
